name: observability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC sign-in to AWS, no stored keys

env:
  AWS_REGION: us-east-1
  METRICS_ROLE: arn:aws:iam::870342665742:role/github-observability-metrics

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        working-directory: app
        run: python3 -m unittest -v

      # The app, Logstash, Elasticsearch and Kibana, started together and waited on until healthy
      - name: Start the logging stack
        run: docker compose up -d --build --wait

      - name: Load test
        run: python3 scripts/load_test.py http://localhost:8080 400

      - name: Logstash to Elasticsearch check
        run: python3 scripts/check_logs.py http://localhost:9200

      - name: Kibana saved searches
        run: |
          curl -sf -X POST "http://localhost:5601/api/saved_objects/_import?overwrite=true" \
            -H "kbn-xsrf: true" --form file=@kibana/saved-objects.ndjson | tee import.json
          python3 -c "import json; r = json.load(open('import.json')); assert r['success'], r; print(f\"\nImported {r['successCount']} saved objects: App logs, Errors, Slow requests\")"

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.METRICS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish metrics to CloudWatch
        run: python3 scripts/publish_cloudwatch.py

      - name: Check CloudWatch alarms
        run: |
          aws cloudwatch describe-alarms --alarm-names orders-api-error-rate orders-api-p95-latency \
            --query 'MetricAlarms[].[AlarmName,StateValue,Threshold]' --output table
          test "$(aws cloudwatch describe-alarms --alarm-names orders-api-error-rate orders-api-p95-latency --query 'length(MetricAlarms)')" = 2

      - name: Send metrics to Datadog
        env:
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_SITE: ${{ vars.DATADOG_SITE }}
        run: python3 scripts/send_datadog.py

      - name: SLO check
        run: python3 scripts/slo_check.py

      - name: Show stack logs on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 50
