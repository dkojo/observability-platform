# The whole logging stack on one machine: the app writes JSON logs to a shared volume,
# Logstash ships them into Elasticsearch, and Kibana lets you search them.
#   docker compose up -d --build --wait     then open http://localhost:5601
services:
  app:
    build: ./app
    ports: ["8080:8080"]
    volumes: ["app-logs:/var/log/app"]

  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.8
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - app-logs:/var/log/app:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/_node/pipelines/main"]
      interval: 5s
      timeout: 3s
      retries: 40

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local demo only: no passwords, nothing exposed beyond this machine
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      timeout: 5s
      retries: 40

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.8
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on:
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  app-logs:
